{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ product.name }}</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: #f5f5f5;
        }

        .product-container {
            max-width: 1100px;
            margin: 60px auto;
            display: flex;
            gap: 40px;
            padding: 20px;
        }

        /* LEFT IMAGE */
        .product-image {
            flex: 1.2;
        }

        .product-image img {
            width: 100%;
            border-radius: 12px;
            max-height: 600px;
            object-fit: cover;
            transition: 0.4s ease;
        }

        .product-image img:hover {
            transform: scale(1.03);
        }

        /* RIGHT DETAILS */
        .product-details {
            flex: 1;
            padding-top: 20px;
        }

        .product-details h2 {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .price {
            font-size: 28px;
            color: #ff3d2e;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .rating {
            font-size: 16px;
            background: #ffdd00;
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
        }

        .product-details p {
            font-size: 16px;
            color: #444;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        .buy-btn {
            background: linear-gradient(135deg, #ff4e2f, #ff2600);
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            display: inline-block;
            margin-top: 25px;
            transition: 0.3s;
        }

        .buy-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 50, 20, 0.4);
        }

        /* POPUP FORM */
        .popup-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .popup-box {
            background: #fff;
            width: 400px;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            animation: fadeIn .4s ease;
        }

        @keyframes fadeIn {
            from { opacity:0; transform: scale(0.9); }
            to { opacity:1; transform: scale(1); }
        }

        .popup-box input, .popup-box textarea {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        .submit-btn {
            background: #ff2600;
            color: white;
            padding: 10px 25px;
            border-radius: 6px;
            border: none;
            margin-top: 15px;
            cursor: pointer;
            font-size: 17px;
        }

        .submit-btn:hover {
            background: #ff4822;
        }

        .close {
            float: right;
            font-size: 20px;
            cursor: pointer;
            margin-top: -10px;
        }
    </style>
</head>

<body>

<div class="product-container">

    <!-- LEFT IMAGE -->
    <div class="product-image">
        {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}">
        {% endif %}
    </div>

    <!-- RIGHT DETAILS -->
    <div class="product-details">
        <h2>{{ product.name }}</h2>
        <div class="price">₹{{ product.price }}</div>
        <div class="rating">⭐ {{ product.rating }}/5</div>

        <p>{{ product.description1 }}</p>
        <p>{{ product.description2 }}</p>

        <a class="buy-btn" onclick="openPopup()">Buy Now</a>
    </div>

</div>

<!-- POPUP FORM -->
<div class="popup-bg" id="popup">
    <div class="popup-box">
        <span class="close" onclick="closePopup()">×</span>
        <h3>Place Your Order</h3>

        <input type="text" id="order_name" placeholder="Your Name">
        <input type="text" id="order_mobile" placeholder="Mobile Number">
        <textarea id="order_address" rows="3" placeholder="Full Address"></textarea>

        <button class="submit-btn" onclick="placeOrder()">Submit</button>
    </div>
</div>

<script>
    function openPopup() {
        document.getElementById("popup").style.display = "flex";
    }

    function closePopup() {
        document.getElementById("popup").style.display = "none";
    }

    function placeOrder() {
        alert("🎉 Your order has been placed successfully!");
        closePopup();
    }
</script>

</body>
</html>
